# DFES Emergency WA - "Fire and Emergencies" dashboard (enhanced)
#
# Requires these HACS frontend cards: map-card (nathan-gs/ha-map-card) and
# auto-entities (thomasloven/lovelace-auto-entities).
# Adds: colour-coded pins, shaded warning areas, tap a pin for its details
# ("Selected on map" panel), Esri street map and an optional wind layer.
#
# Entity IDs assume the integration entry is named "DFES Home" (sensor.dfes_home_...).
# If you named it something else, find-and-replace "dfes_home" with your prefix.
#
# How to use: Settings > Dashboards > Add dashboard > New dashboard from scratch,
# open it, then ⋮ > Edit dashboard > ⋮ > Raw configuration editor, paste this file and Save.

title: Fire and Emergencies
views:
- title: Fire Map
  path: fire-map
  icon: mdi:map-marker-alert
  type: sections
  max_columns: 3
  sections:
  - type: grid
    column_span: 2
    cards:
    - type: markdown
      text_only: true
      grid_options:
        columns: full
      content: |-
        ### <ha-icon icon="mdi:fire"></ha-icon> {% set r = state_attr('sensor.dfes_home_incidents_nearby', 'radius_km') %}{% if r %}Within {{ r | int }} km of home{% else %}Near home{% endif %}
    - type: custom:auto-entities
      unique: true
      grid_options:
        columns: full
        rows: 9
      filter:
        include:
        - domain: geo_location
          attributes:
            source: dfes_wa
            kind: warning
            alert_level: Emergency Warning
          options:
            display: icon
            color: '#d32f2f'
            size: 40
            tap_action:
              action: call-service
              service: dfes_wa.select_pin
              data:
                pin: this.entity_id
            geojson:
              attribute: geojson
              color: '#d32f2f'
              fill_opacity: 0.35
        - domain: geo_location
          attributes:
            source: dfes_wa
            kind: warning
            alert_level: Watch and Act
          options:
            display: icon
            color: '#f57c00'
            size: 40
            tap_action:
              action: call-service
              service: dfes_wa.select_pin
              data:
                pin: this.entity_id
            geojson:
              attribute: geojson
              color: '#f57c00'
              fill_opacity: 0.3
        - domain: geo_location
          attributes:
            source: dfes_wa
            kind: warning
          options:
            display: icon
            color: '#fbc02d'
            size: 40
            tap_action:
              action: call-service
              service: dfes_wa.select_pin
              data:
                pin: this.entity_id
            geojson:
              attribute: geojson
              color: '#fbc02d'
              fill_opacity: 0.25
        - domain: geo_location
          attributes:
            source: dfes_wa
            kind: incident
          options:
            display: icon
            color: var(--red-color)
            size: 36
            tap_action:
              action: call-service
              service: dfes_wa.select_pin
              data:
                pin: this.entity_id
        - entity_id: zone.home
          options:
            display: icon
            color: var(--blue-color)
      card:
        type: custom:map-card
        focus_entity: zone.home
        zoom: 9
        theme_mode: light
        card_size: 9
        tile_layer_url: https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}
        tile_layer_attribution: Tiles &copy; Esri &mdash; Esri, HERE, Garmin, &copy; OpenStreetMap contributors
        tile_layer_options:
          maxZoom: 16
          referrerPolicy: no-referrer
        # Optional regional wind layer (wind speed shading). Get a free API key at
        # https://openweathermap.org (My API keys), then uncomment and paste it in.
        # tile_layers:
        #   - url: https://tile.openweathermap.org/map/wind_new/{z}/{x}/{y}.png?appid=YOUR_OPENWEATHERMAP_KEY
        #     options:
        #       opacity: 0.6
        #       maxZoom: 16
        #       attribution: Wind &copy; <a href="https://openweathermap.org/">OpenWeatherMap</a>
  - type: grid
    cards:
    - type: heading
      heading: Status
      icon: mdi:alert-circle-outline
    - type: heading
      heading: Selected on map
      heading_style: subtitle
      icon: mdi:map-marker-check
      visibility:
      - condition: state
        entity: sensor.dfes_home_selected_on_map
        state_not:
        - unknown
        - unavailable
      badges:
      - type: button
        icon: mdi:close
        text: Close
        tap_action:
          action: perform-action
          perform_action: dfes_wa.clear_selection
    - type: markdown
      grid_options:
        columns: full
      visibility:
      - condition: state
        entity: sensor.dfes_home_selected_on_map
        state_not:
        - unknown
        - unavailable
      content: |
        {% set a = states.sensor.dfes_home_selected_on_map.attributes %}
        {%- if a.get('cleared') %}This incident has cleared.
        {%- elif a.get('pin') %}{% set p = as_datetime(a.published) if a.published else none %}
        ## {{ a.type or states('sensor.dfes_home_selected_on_map') }}
        {% if a.kind == 'warning' %}**{{ a.alert_level or 'Warning' }}**

        {{ a.title }}
        {% else %}**{{ (a.suburb ~ (', ' ~ a.lga if a.lga else '')) | upper }}**
        {% endif %}
        {% if p %}- Time reported: {{ (p | as_local).strftime('%-I:%M %p, %A %-d %B') }}
        {% endif %}- Distance from home: {{ a.distance_km }} km
        {% if a.region %}- Region: {{ a.region }}
        {% endif %}{% if a.incident_number %}- Incident number: {{ a.incident_number }}
        {% endif %}
        {% if a.link %}[Full details on Emergency WA →]({{ a.link }}){% endif %}
        {%- endif %}
    - type: tile
      entity: sensor.dfes_home_incidents_nearby
      name: Active incidents
    - type: tile
      entity: binary_sensor.dfes_home_fire_nearby
      name: Fire nearby
    - type: tile
      entity: sensor.dfes_home_warnings_nearby
      name: Official warnings
    - type: tile
      entity: binary_sensor.dfes_home_watch_and_act_or_emergency_warning
      name: Watch and Act / Emergency
    - type: tile
      entity: sensor.dfes_home_fire_danger_rating_today
      name: Fire danger today
    - type: tile
      entity: sensor.dfes_home_fire_danger_rating_tomorrow
      name: Fire danger tomorrow
    - type: markdown
      grid_options:
        columns: full
      content: "{% set w = state_attr('sensor.dfes_home_warnings_nearby', 'warnings') or [] %}\n{%- if w %}### Warnings\n{% for i in w %}**{{ i.alert_level or i.type }}** – {{ i.title | title }}  \n{{ i.distance_km\
        \ }} km · [details]({{ i.link }})\n\n{% endfor %}{% else %}No official warnings near home.{% endif %}\n"
    - type: markdown
      grid_options:
        columns: full
      content: "{% set inc = state_attr('sensor.dfes_home_incidents_nearby', 'incidents') or [] %}\n{%- if inc %}### Current incidents\n{% for i in inc %}**{{ i.type }}** – {{ i.suburb }}  \n{{ i.distance_km\
        \ }} km · {{ i.region }} · [details]({{ i.link }})\n\n{% endfor %}{% else %}No active incidents near home.{% endif %}\n"
