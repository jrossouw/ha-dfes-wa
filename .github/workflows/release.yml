name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set version in manifest
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          jq --arg v "$VERSION" '.version = $v' custom_components/dfes_wa/manifest.json > m.json
          mv m.json custom_components/dfes_wa/manifest.json
      - name: Zip integration
        run: cd custom_components/dfes_wa && zip -r ../../dfes_wa.zip .
      - uses: softprops/action-gh-release@v2
        with:
          files: dfes_wa.zip
